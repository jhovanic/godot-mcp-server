version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: godot-mcp-server
    main: ./cmd/godot-mcp-server
    binary: godot-mcp-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.serverVersion={{ .Version }}

archives:
  - id: default
    ids:
      - godot-mcp-server
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    # Ship the fixed headless-tier operations script alongside the binary:
    # cmd/godot-mcp-server's default -operations-script path resolves it as
    # scripts/godot_operations.gd next to the executable. Also ship the TCP
    # runtime tier's autoload template (scripts/mcp_runtime_autoload.gd) —
    # not loaded by this binary itself, but the operator needs the file
    # available to copy into their own project; see README.md's "Enabling
    # the TCP runtime tier".
    files:
      - LICENSE
      - README.md
      - SECURITY.md
      - src: scripts/godot_operations.gd
        dst: scripts/godot_operations.gd
      - src: scripts/mcp_runtime_autoload.gd
        dst: scripts/mcp_runtime_autoload.gd

checksum:
  name_template: "checksums.txt"

# Keyless signing via cosign/Sigstore: the signature is tied to the GitHub
# Actions workflow's own OIDC identity (see release.yml's id-token: write
# and the cosign-installer step) — there is no private key for the
# maintainer to generate, store, or lose. Signing the checksums file is
# sufficient to cover every archive, since each archive's hash is listed in
# it. Verify with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp 'https://github.com/jhovanic/godot-mcp-server/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes
    artifacts: checksum
    output: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: jhovanic
    name: godot-mcp-server
